name: Run Banking Pipeline

on:
  schedule:

    - cron: '0 6 * * 1'
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn python-dateutil pytz
          
      - name: Run pipeline
        run: python main.py
        
      - name: Upload cleaning reports
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-reports-${{ github.run_number }}
          path: cleaning_reports/
          if-no-files-found: warn
          retention-days: 30
